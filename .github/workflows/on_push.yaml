name: build-on-push

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - '**/docker-compose.yml'
      - 'CHANGELOG.md'
      - 'README.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - '**/docker-compose.yml'
      - 'CHANGELOG.md'
      - 'README.md'

permissions:
  packages: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build_docker:
    name: Build Docker
    # runs-on: self-hosted
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # so we get proper snapshot version info
          fetch-depth: 0

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.MY_GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.3
          cache: false

      - name: Remote cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      # repo disappeared
      # - name: Local cache
      #   uses: actions-self-hosted/cache@v4
      #   if: ${{ runner.environment == 'self-hosted' }}
      #   with:
      #     cache-dir: /local-cache
      #     path: |
      #       ~/.cache/go-build
      #       ~/go/pkg/mod
      #     key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Set up GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: latest
          install-only: true

      - name: Test
        run: |
          set -eo pipefail
          go mod tidy
          go mod download
          go test ./...

      - name: Build artifacts (goreleaser)
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          # Build artifacts only; use 'goreleaser build' to avoid publishing since some
          # goreleaser versions do not support --skip-publish on 'release'.
          goreleaser build --clean --snapshot

      - name: Build multi-arch Docker image
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -eo pipefail
          SHA=${{ github.sha }}
          # Prepare docker build context containing per-arch binaries produced by goreleaser in dist/
          mkdir -p docker-context/linux/amd64 docker-context/linux/arm64
          # Copy the built binaries into the expected layout for the Dockerfile
          cp dist/*_linux_amd64*/traefik-kop docker-context/linux/amd64/traefik-kop
          cp dist/*_linux_arm64*/traefik-kop docker-context/linux/arm64/traefik-kop

          # Build and push images per-arch specifying the BIN_PATH build-arg so the Dockerfile copies the correct file
          docker buildx build --platform linux/amd64 -t $REGISTRY/$IMAGE_NAME:${SHA}-amd64 -f Dockerfile --build-arg BIN_PATH=linux/amd64/traefik-kop docker-context
          docker buildx build --platform linux/arm64 -t $REGISTRY/$IMAGE_NAME:${SHA}-arm64 -f Dockerfile --build-arg BIN_PATH=linux/arm64/traefik-kop docker-context

          # # Create a multi-arch manifest tag that references the per-arch images
          # docker buildx imagetools create --tag $REGISTRY/$IMAGE_NAME:${SHA} $REGISTRY/$IMAGE_NAME:${SHA}-amd64 $REGISTRY/$IMAGE_NAME:${SHA}-arm64
          # # Optionally also tag 'latest' or versioned tags mapping to the multi-arch manifest
          # docker buildx imagetools create --tag $REGISTRY/$IMAGE_NAME:latest $REGISTRY/$IMAGE_NAME:${SHA}-amd64 $REGISTRY/$IMAGE_NAME:${SHA}-arm64

      # 'Push docker images' step removed: images are pushed by the buildx steps above.
      # This avoids redundant/empty pushes and potential CI confusion.
      # - name: Cleanup local docker images
      #   if: ${{ runner.environment == 'self-hosted' }}
      #   run: |
      #     # traefik-kop images
      #     docker images --filter "reference=ghcr.io/baragoon/traefik-kop" -q \
      #       | sort -u \
      #       | xargs -r docker rmi -f

      #     # dangling runner images
      #     docker images --filter "reference=myoung34/github-runner" --filter "dangling=true" -q \
      #       | sort -u \
      #       | xargs -r docker rmi -f

      - name: Cleanup old images from registry
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          tags: "*-next-*"
          older-than: "30 days"
          delete-untagged: true
