name: tagged-release

on:
  push:
    tags:
      - "v*"

permissions:
  packages: write
  contents: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  tagged-release:
    name: Tagged Release
    # runs-on: self-hosted
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.MY_GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          cache: false

      - name: Remote cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      # repo disappeared
      # - name: Local cache
      #   uses: actions-self-hosted/cache@v4
      #   if: ${{ runner.environment == 'self-hosted' }}
      #   with:
      #     cache-dir: /local-cache
      #     path: |
      #       ~/.cache/go-build
      #       ~/go/pkg/mod
      #     key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Test
        run: |
          set -eo pipefail
          go mod tidy
          go mod download
          go test ./...

      - name: Revert module file changes
        run: |
          # revert accidental changes produced by `go mod tidy`
          git checkout -- go.mod go.sum || true
          # show status for debugging
          git status --porcelain

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        with:
          version: latest
          args: release --clean

      # - name: Cleanup local docker images
      #   if: ${{ runner.environment == 'self-hosted' }}
      #   run: |
      #     # traefik-kop images
      #     docker images --filter "reference=ghcr.io/baragoon/traefik-kop" -q \
      #       | sort -u \
      #       | xargs -r docker rmi -f

      #     # dangling runner images
      #     docker images --filter "reference=myoung34/github-runner" --filter "dangling=true" -q \
      #       | sort -u \
      #       | xargs -r docker rmi -f

      - name: Cleanup old images from registry
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          tags: "*-next-*"
          older-than: "30 days"
          delete-untagged: true
