services:
  redis:
    image: redis:8.10-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 60

  traefik:
    image: traefik:v3.7.18@sha256:9c437ac4f09ce6f4980a8544902d3475fdf70a1a7c578729581d2535dfa7d635
    command:
      - --api.insecure=true
      - --entrypoints.web.address=:80
      - --providers.redis.endpoints=redis:6379
      - --providers.redis.rootkey=traefik
    ports:
      - "127.0.0.1::80"
      - "127.0.0.1::8080"
    volumes:
      - "${TRAEFIK_KOP_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro"
    depends_on:
      redis:
        condition: service_healthy

  whoami:
    image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    hostname: integration-whoami
    labels:
      traefik.http.routers.integration.rule: "Host(`integration.test`)"
      traefik.http.routers.integration.entrypoints: web
      traefik.http.routers.integration.service: integration
      traefik.http.services.integration.loadbalancer.server.port: "80"
